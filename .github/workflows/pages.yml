name: Recovery Web Pages

on:
  push:
    branches: [main]
    paths:
      - "recovery/web/**"
      - "recovery/lib/**"
      - "docs/deployments.json"
      - "sdk/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Enable Corepack
        run: corepack enable
      - name: Install dependencies
        working-directory: recovery/web
        run: yarn install
      - name: Build recovery web
        working-directory: recovery/web
        env:
          GITHUB_PAGES: "true"
        run: yarn build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: recovery/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
